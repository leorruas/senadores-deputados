<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f0">
  <meta name="description" content="{{ page.resumo | default: site.description | escape }}">
  <title>{% if page.nome %}{{ page.nome | escape }} : {% elsif page.title %}{{ page.title | escape }} : {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <div class="barra-superior"><div class="container barra-interna"><span>Observatório independente</span><span>Arquivo público · atualizado por pesquisa</span></div></div>
  <header class="cabecalho container">
    <a class="marca" href="{{ '/' | relative_url }}" aria-label="Arquivo parlamentar: página inicial">ARQUIVO<span>PARLAMENTAR</span><span class="marca-ponto">.</span></a>
    <nav class="navegacao" aria-label="Navegação principal">
      <a href="{{ '/' | relative_url }}">Parlamentares</a>
      <a href="{{ '/metodologia/' | relative_url }}">Metodologia</a>
      <a href="https://github.com/leorruas/senadores-deputados" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </nav>
  </header>
  <main id="conteudo" class="container conteudo-principal">{{ content }}</main>
  <footer class="rodape">
    <div class="container rodape-interno"><p>Arquivo parlamentar. Dados, fontes e hipóteses com registro de atualização.</p><a href="https://github.com/leorruas/senadores-deputados" target="_blank" rel="noopener noreferrer">Consultar os arquivos no GitHub ↗</a></div>
  </footer>
</body>
</html>
