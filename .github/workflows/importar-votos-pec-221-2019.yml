name: Importar votos nominais da PEC 221/2019

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/importar_votos_pec_221_2019.py'
      - '.github/workflows/importar-votos-pec-221-2019.yml'

permissions:
  contents: write

jobs:
  importar-votos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install requests beautifulsoup4

      - name: Importar e validar os dois mapas nominais
        run: python scripts/importar_votos_pec_221_2019.py

      - name: Registrar dados verificados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/votos_pec_221_2019.json
          if ! git diff --cached --quiet; then
            git commit -m "data: importa votos nominais oficiais da PEC 221/2019"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
