name: Atualizar inventário da Câmara

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/importar_deputados_camara.py'
      - '.github/workflows/atualizar-camara.yml'
  schedule:
    - cron: '0 10 * * 1'

permissions:
  contents: write

jobs:
  importar-camara:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install requests

      - name: Importar deputados em exercício e validar 513 vagas
        run: python scripts/importar_deputados_camara.py

      - name: Publicar o retrato no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/deputados_camara.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualiza 513 deputados em exercício na Câmara"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
